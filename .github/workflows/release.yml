name: Release

# A version tag (v1.2.3) builds the universal app, signs it with the Developer ID, has Apple
# notarize it, and drafts a GitHub release with the disk image. Run by hand, it does the same
# without a release: the signed disk image is left as a workflow artifact, to try the pipeline.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and notarize
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      SIGNING_IDENTITY: "Developer ID Application: seonung park (T77ZY4CF39)"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8

      # The key file stays in the runner's temporary folder, which is wiped after the job.
      - name: Write the notarization key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      # Signing is set here, not in Cargo.toml, so local builds and pull requests package
      # unsigned on machines without the certificate.
      - name: Sign with the Developer ID
        run: printf '\nsigningIdentity = "%s"\n' "$SIGNING_IDENTITY" >> Cargo.toml

      - name: Package, sign and notarize the app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cargo packager --release --target universal-apple-darwin

      # The app inside is notarized already; notarizing the disk image too lets Gatekeeper
      # pass it offline, the first time it is opened after download.
      - name: Notarize the disk image
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          dmg=$(ls dist/*.dmg)
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"

      - name: Check signature, notarization and architectures
        run: |
          app="dist/WithHuman Viewer.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate dist/*.dmg
          lipo -info "$app/Contents/MacOS/withhuman-viewer" | grep -q "x86_64 arm64"

      - name: Write checksums
        working-directory: dist
        run: shasum -a 256 *.dmg > SHA256SUMS

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.dmg

      - name: Upload the disk image
        uses: actions/upload-artifact@v4
        with:
          name: withhuman-viewer-signed
          path: |
            dist/*.dmg
            dist/SHA256SUMS
          retention-days: 14

      # A draft, so the notes can be read over before the release is published.
      - name: Draft the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/SHA256SUMS \
            --draft --generate-notes --title "WithHuman Viewer ${GITHUB_REF_NAME#v}"
