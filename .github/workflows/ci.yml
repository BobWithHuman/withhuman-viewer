name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint and test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@v2

  # Both apps on Windows: built, linted, tested and packaged as their installers there, so what
  # only breaks on Windows shows up here.
  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

      # The security team's app (`cargo admin`) too: built, linted and tested on Windows.
      - name: Run Clippy on the security team's app
        run: cargo clippy --all-targets --locked --no-default-features --features admin -- -D warnings

      - name: Run the security team's app's tests
        run: cargo test --locked --no-default-features --features admin

      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8

      - name: Package the developer's app
        run: scripts/package-windows.sh dev

      - name: Package the security team's app
        run: scripts/package-windows.sh admin

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: withhuman-windows
          path: dist/*.exe
          retention-days: 7

  # Packages the universal app unsigned, so a change that only breaks inside the bundle shows up
  # before a release does.
  package:
    name: Package the universal app
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8

      - name: Package
        run: cargo packager --release --target universal-apple-darwin

      - name: Check the app is universal
        run: lipo -info "dist/WithHuman Viewer.app/Contents/MacOS/withhuman-viewer" | grep -q "x86_64 arm64"

      - name: Upload the disk image
        uses: actions/upload-artifact@v4
        with:
          name: withhuman-viewer-dmg
          path: dist/*.dmg
          retention-days: 7
